<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Direct Sales Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized app frame; agent and manager share it, sheets slide over it. Deliberate single light look. */
:root{
  color-scheme:light;
  --red:#D7192A;--red-d:#B10F1F;--red-50:#FDECEE;
  --ink:#15171A;--ink2:#3A3F45;--muted:#6E747B;--line:#E7E8EB;
  --bg:#F3F4F6;--card:#FFFFFF;--frame:#E6E7EB;
  --green:#12924A;--green-50:#E6F5EC;--amber:#B86204;--amber-50:#FFF3E2;--blue:#1A56C4;--blue-50:#E8F0FE;
  --sea:#D8E7F1;--land:#F1F2EC;--road:#FFFFFF;
  --r:20px;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--frame);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(215,25,42,.35);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
.app{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){
  body{align-items:center;padding:24px 0}
  .app{height:min(880px,100%);border-radius:40px;border:9px solid #0E0F11;box-shadow:0 30px 80px rgba(0,0,0,.22)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:18px 18px 10px;background:var(--bg)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#E8394A,#A80D1C);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;flex:none}
.avatar.mgr{background:linear-gradient(135deg,#3A3F45,#15171A)}
.top .who{flex:1;min-width:0}
.top .hello{font-size:13px;color:var(--muted)}
.top .name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.iconbtn{position:relative;width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.demo{margin:0 18px 6px;font-size:11.5px;color:#7A5B00;background:#FFF7D6;border:1px solid #F3E2A0;border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center}
main{flex:1;overflow-y:auto;padding:8px 18px 110px;scroll-behavior:smooth}
main::-webkit-scrollbar{display:none}
.app.out .top,.app.out nav.tabs{display:none}
.app.out main{padding-bottom:30px}
h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 small{font-size:13px;color:var(--red);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:#EEEFF1;color:var(--ink2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{background:var(--green-50);color:var(--green)}
.pill.amber{background:var(--amber-50);color:var(--amber)}
.pill.red{background:var(--red-50);color:var(--red)}
.pill.blue{background:var(--blue-50);color:var(--blue)}
/* hero */
.hero{padding:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -60px -90px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(215,25,42,.07),transparent 70%)}
.hero.on::before{background:radial-gradient(circle,rgba(18,146,74,.09),transparent 70%)}
.shift{margin:16px 0 4px}
.label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.place{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-top:4px}
.place a{color:var(--red);font-weight:600;text-decoration:none;margin-inline-start:auto;font-size:13px}
.timer{margin:14px 0 2px;padding:12px 14px;border-radius:14px;background:var(--green-50)}
.clock{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green);letter-spacing:-.02em}
.btn-punch{margin-top:16px;width:100%;height:64px;border-radius:18px;background:var(--red);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(215,25,42,.32);transition:transform .12s,background .2s}
.btn-punch:active{transform:scale(.98)}
.btn-punch:hover{background:var(--red-d)}
.btn-punch.out{background:var(--ink);box-shadow:0 10px 24px rgba(21,23,26,.25)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
/* alert */
.alert{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--card);border:1.5px solid #F6C9CE;margin-bottom:14px;box-shadow:var(--shadow)}
.alert .ico{width:40px;height:40px;border-radius:12px;background:var(--red-50);color:var(--red);display:grid;place-items:center;flex:none;animation:pulse 2s infinite}
.alert .t{font-weight:700;font-size:14px}.alert .s{font-size:12.5px;color:var(--muted)}
.alert button{margin-inline-start:auto;background:var(--red);color:#fff;font-weight:600;font-size:13px;padding:9px 12px;border-radius:12px;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(215,25,42,.25)}50%{box-shadow:0 0 0 7px rgba(215,25,42,0)}}
/* quick actions */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa{background:var(--card);border-radius:18px;padding:14px;text-align:start;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .12s}
.qa:active{transform:scale(.97)}
.qa .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa b{font-size:14px;font-weight:600}.qa span{font-size:12px;color:var(--muted);margin-top:-6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{padding:14px}.mini .v{font-weight:700;font-size:15px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:14px;text-align:start;width:100%}
.item .ico{width:40px;height:40px;border-radius:12px;background:#F1F2F4;display:grid;place-items:center;flex:none;color:var(--ink2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none;background:#EEE}
.thumb.ph{display:grid;place-items:center;color:var(--amber);background:var(--amber-50)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:start}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.stat.warn b{color:var(--amber)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip.lock{color:var(--muted)}
/* bottom nav */
nav.tabs{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#8B9097;padding:6px 0;border-radius:12px;position:relative}
nav.tabs button.active{color:var(--red);font-weight:600}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* schedule */
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.week::-webkit-scrollbar{display:none}
.day{flex:1;min-width:44px;padding:10px 0;border-radius:14px;background:var(--card);text-align:center;box-shadow:var(--shadow)}
.day .d{font-size:11px;color:var(--muted)}.day .n{font-size:17px;font-weight:700;margin-top:2px}
.day .m{width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:var(--red)}
.day.off .m{background:#C2C6CC}
.day.today{background:var(--ink);color:#fff}.day.today .d{color:#BFC3C8}
.sched{display:flex;gap:12px;align-items:stretch;padding:14px}
.sched .date{width:44px;text-align:center;flex:none}
.sched .date b{display:block;font-size:20px}.sched .date span{font-size:11px;color:var(--muted)}
.sched .bar{width:4px;border-radius:4px;background:var(--red);flex:none}
.sched.off .bar{background:#D0D3D8}.sched.leave .bar{background:var(--blue)}
/* buttons */
.btn{height:54px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(215,25,42,.28)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#E9EAED;color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.link{height:44px;color:var(--red);font-size:14px;font-weight:600}
.btn.sm{height:42px;font-size:14px;border-radius:13px}
.btns{display:flex;gap:8px}
/* sheet */
.sheet{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sh-top{display:flex;align-items:center;gap:10px;padding:18px 16px 8px}
.sh-top .ttl{flex:1;font-weight:700;font-size:16px;text-align:center}
.sh-top .iconbtn{box-shadow:none;background:#F1F2F4;width:38px;height:38px;border-radius:12px}
.steps{display:flex;gap:6px;padding:4px 18px 0}
.steps i{flex:1;height:4px;border-radius:4px;background:#ECEDEF;transition:background .3s}
.steps i.on{background:var(--red)}
.steps-l{display:flex;justify-content:space-between;padding:6px 18px 0;font-size:11px;color:var(--muted)}
.steps-l span.on{color:var(--ink);font-weight:600}
.sh-body{flex:1;overflow-y:auto;padding:18px 20px}
.sh-foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sh-foot:empty{display:none}
.sh-body h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;text-wrap:balance}
.lead{color:var(--muted);font-size:14.5px;line-height:1.5}
.bul{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.bul:last-child{border:0}
.bul .ico{width:40px;height:40px;border-radius:12px;background:var(--red-50);color:var(--red);display:grid;place-items:center;flex:none}
.bul b{display:block;font-size:14.5px}.bul span{font-size:13px;color:var(--muted);line-height:1.45}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);background:#EEF0F3;border-radius:14px;padding:12px;line-height:1.45;margin-top:14px}
.note svg{flex:none;margin-top:1px}
.center{text-align:center}
/* locating */
.radar{width:180px;height:180px;margin:28px auto 22px;position:relative;display:grid;place-items:center}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:0;animation:ring 2s infinite}
.radar::after{animation-delay:1s}
.radar .core{width:72px;height:72px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(215,25,42,.4)}
@keyframes ring{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1);opacity:0}}
/* mini map */
.minimap{height:190px;border-radius:18px;position:relative;overflow:hidden;margin:16px 0 14px;
  background:
   linear-gradient(90deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%) 0 0/120px 120px,
   linear-gradient(0deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%) 0 0/120px 120px,
   linear-gradient(35deg,transparent 48%,#FFE7A8 48%,#FFE7A8 52%,transparent 52%),
   #E9EEF2}
.minimap .acc{position:absolute;left:50%;top:50%;border-radius:50%;background:rgba(26,86,196,.12);border:1.5px solid rgba(26,86,196,.4);transform:translate(-50%,-50%)}
.minimap .me{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.minimap .tag{position:absolute;left:10px;bottom:10px;font-size:11px;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:8px;color:var(--ink2)}
.kv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
.kv>div:last-child{border:0}
.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:end}
.kv a{color:var(--red);font-weight:600;text-decoration:none}
.gnote{font-family:Roboto,Arial,sans-serif;font-size:12px;color:#5E5E5E;font-weight:400}
/* big map */
.bigmap{border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:var(--shadow);position:relative}
.bigmap svg{display:block;width:100%;height:auto}
.bigmap .mk{cursor:pointer}
.bigmap .tag{position:absolute;left:10px;bottom:10px;font-size:11px;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:8px;color:var(--ink2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--green)}
.legend i.st{background:#fff;border:2px dashed var(--amber)}
.legend i.sq{border-radius:3px;background:var(--ink)}
/* camera */
.camwrap{position:relative;border-radius:24px;overflow:hidden;background:#111;aspect-ratio:3/4;max-width:100%;margin-top:6px}
.camwrap video,.camwrap canvas,.camwrap img{width:100%;height:100%;object-fit:cover;display:block}
.camwrap video{transform:scaleX(-1)}
.oval{position:absolute;inset:12% 18% 18%;border:3px dashed rgba(255,255,255,.75);border-radius:50%;pointer-events:none}
.camtag{position:absolute;top:12px;left:12px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:5px 9px;border-radius:999px;display:flex;align-items:center;gap:6px}
.camtag i{width:7px;height:7px;border-radius:50%;background:#FF4D5E;animation:blink 1.2s infinite}
.wm{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:8px}
@keyframes blink{50%{opacity:.2}}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--red);margin:0 auto;box-shadow:0 0 0 3px var(--red),0 10px 24px rgba(215,25,42,.35);transition:transform .1s}
.shutter:active{transform:scale(.92)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
/* saving */
.prog{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.prog div{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.prog div.done{color:var(--ink)}
.prog .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #E1E3E6;flex:none}
.prog .done .st{background:var(--green);border-color:var(--green);color:#fff}
.prog .now .st{border-color:var(--red);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:26px auto 18px;box-shadow:0 14px 36px rgba(18,146,74,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ok.amber{background:var(--amber);box-shadow:0 14px 36px rgba(184,98,4,.3)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.err{width:84px;height:84px;border-radius:50%;background:var(--amber-50);color:var(--amber);display:grid;place-items:center;margin:26px auto 16px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;background:#fff;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field .errtxt{color:var(--red);font-size:12.5px}
.seg{display:flex;background:#E9EAED;border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* sign-in */
.login{display:flex;flex-direction:column;min-height:100%;padding-top:34px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;background:var(--red);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px;letter-spacing:-.02em;box-shadow:0 10px 24px rgba(215,25,42,.3)}
.brand b{display:block;font-size:17px}.brand span{font-size:13px;color:var(--muted)}
.login h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:44px 0 8px}
.login .lead{margin-bottom:26px}
.btn.passkey{height:62px;font-size:17px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.otp{font-size:28px!important;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
/* OS-style passkey sheet */
.os{position:absolute;inset:0;z-index:30;background:rgba(10,12,15,.38);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.os.open{opacity:1;pointer-events:auto}
.os-card{width:100%;background:#F7F7F8;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.os.open .os-card{transform:none}
.os-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.os-head .k{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center}
.os-head b{flex:1;font-size:16px}
.os-site{font-size:13px;color:var(--muted);margin-bottom:14px}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;text-align:start}
.acct .avatar{width:38px;height:38px;font-size:13px}
.acct b{display:block;font-size:14.5px}.acct span{font-size:12.5px;color:var(--muted)}
.faceid{width:86px;height:86px;margin:14px auto;border-radius:24px;display:grid;place-items:center;color:var(--blue);background:var(--blue-50);animation:breathe 1s ease-in-out infinite}
.faceid.done{color:#fff;background:var(--green);animation:pop .4s}
@keyframes breathe{50%{transform:scale(1.07)}}
/* toast */

const TZ='Asia/Bahrain';
const fT=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const fD=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'});

const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return [s/3600,(s%3600)/60,s%60].map(v=>String(Math.floor(v)).padStart(2,'0')).join(':')};
const agoTxt=m=>{m=Math.round(m);if(m<1)return 'just now';if(m<60)return m+' min ago';return Math.floor(m/60)+' h '+(m%60)+' min ago'};

/* ---------- synthetic portraits (fictional, drawn) ---------- */
function portrait(o){
  const c=document.createElement('canvas');c.width=240;c.height=320;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,240,320);g.addColorStop(0,o.bg[0]);g.addColorStop(1,o.bg[1]);x.fillStyle=g;x.fillRect(0,0,240,320);
  x.fillStyle=o.shirt;x.beginPath();x.ellipse(120,335,108,95,0,Math.PI,0);x.fill();
  if(o.ghutra){x.fillStyle='#F3F3F0';x.beginPath();x.ellipse(120,138,70,86,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(52,150);x.lineTo(34,300);x.lineTo(206,300);x.lineTo(188,150);x.fill();}
  if(o.hijab){x.fillStyle=o.hair;x.beginPath();x.ellipse(120,145,70,84,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(52,165);x.quadraticCurveTo(120,265,188,165);x.lineTo(204,305);x.lineTo(36,305);x.fill();}
  x.fillStyle=o.skin;if(!o.hijab&&!o.ghutra)x.fillRect(102,180,36,45);
  x.beginPath();x.ellipse(120,148,50,62,0,0,Math.PI*2);x.fill();
  if(!o.hijab&&!o.ghutra){x.fillStyle=o.hair;x.beginPath();x.ellipse(120,108,54,36,0,Math.PI,0);x.fill();}
  if(o.ghutra){x.strokeStyle='#1B1B1B';x.lineWidth=7;x.beginPath();x.ellipse(120,92,58,14,0,Math.PI,0);x.stroke();}
  if(o.beard){x.fillStyle=o.hair;x.beginPath();x.ellipse(120,183,44,28,0,0,Math.PI);x.fill();x.fillRect(76,160,10,26);x.fillRect(154,160,10,26);}
  x.fillStyle='#2A2321';x.beginPath();x.arc(102,146,4.5,0,7);x.arc(138,146,4.5,0,7);x.fill();
  x.strokeStyle='#2A2321';x.lineWidth=3;x.beginPath();x.moveTo(93,134);x.lineTo(110,132);x.moveTo(130,132);x.lineTo(147,134);x.stroke();
  x.strokeStyle=o.beard?'#F0E6DF':'#7A4A3A';x.lineWidth=3;x.beginPath();x.arc(120,170,12,.25,Math.PI-.25);x.stroke();
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,296,240,24);x.fillStyle='#fff';x.font='600 11px Inter,Arial,sans-serif';x.fillText('SYNTHETIC DEMO PHOTO',10,312);
  return c.toDataURL('image/jpeg',.85);
}

function osVerify(title,after){
  osOpen(`<div class="center"><div class="faceid" id="fid">${ic('face',46)}</div><b style="font-size:16px">${title}</b><p class="os-site" style="margin:4px 0 6px">Look at your phone or touch the sensor</p></div>`);
  osTimer=setTimeout(()=>{const f=document.getElementById('fid');if(f){f.classList.add('done');f.innerHTML=ic('check',46)}osTimer=setTimeout(()=>{osClose();after()},550)},1200);
}

function counts(){

  punchOut:{title:'Punch out',labels:['Info','Location','Save','Done'],map:{notice:0,locating:1,located:1,locfail:1,saving:2,done:3}},
  share:{title:'Share location',labels:['Location','Send','Done'],map:{locating:0,located:0,locfail:0,saving:1,done:2}},
  leave:{title:'Request leave',labels:null,map:{}},
  photo:{title:'Punch-in photo',labels:null,map:{}},
  exc:{title:'Exception review',labels:null,map:{}},

function openFlow(kind,extra){
  F=Object.assign({kind,step:kind==='punchIn'||kind==='punchOut'?'notice':kind==='share'?'locating':'view'},extra||{});
  sheet.classList.add('open'); renderFlow();
  if(F.step==='locating') locate();
}
function closeFlow(){stopCam();clearTimeout(safety);sheet.classList.remove('open');F=null;render();}
function go(step){F.step=step;renderFlow();}
function addrFor(l){
  if(!l) return 'No location';
  if(l.demo) return 'Approx. Seef District, Manama';
  return inBH(l)?'Looked up on the server in the real portal':'Address unavailable';
}

    const next=k==='punchIn'?['primary','startCam',ic('camera')+' Next: take selfie']:k==='punchOut'?['dark','save',ic('logout')+' Confirm punch out']:['primary','save',ic('send')+' Send location'];

  sheet.innerHTML=`<div class="sh-top"><button class="iconbtn" data-act="close" aria-label="Close">${ic('x',18)}</button><div class="ttl">${fl.title}</div><div style="width:38px"></div></div>${steps}<div class="sh-body fade">${body}</div><div class="sh-foot">${foot}</div>`;
  if(st==='camera'){ if(F.demoCam) runDemoCam(); else attachStream(); }
  if(st==='saving') runSaving();

/* location */
function locate(){
  clearTimeout(safety); go('locating');
  const token=F.token=Math.random();
  const ok=p=>{if(!F||F.token!==token||F.step!=='locating')return;clearTimeout(safety);F.loc=p;go('located')};
  const bad=m=>{if(!F||F.token!==token||F.step!=='locating')return;clearTimeout(safety);F.locErr=m;go('locfail')};
  safety=setTimeout(()=>bad('Couldn’t get a reading in time.'),12000);
  if(!navigator.geolocation){setTimeout(()=>bad('This browser can’t provide location.'),700);return}
  const t0=Date.now();
  try{
    navigator.geolocation.getCurrentPosition(
      pos=>setTimeout(()=>ok({lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy),demo:false}),Math.max(0,1100-(Date.now()-t0))),
      err=>setTimeout(()=>bad(err.code===1?'Location permission was denied.':'Couldn’t get a reading in time.'),600),
      {enableHighAccuracy:true,maximumAge:0,timeout:9000});
  }catch(e){bad('Location is blocked in this view.')}
}
function demoLoc(){
  clearTimeout(safety);
  F.loc={lat:26.2335+(Math.random()-.5)*.002,lng:50.5390+(Math.random()-.5)*.002,acc:8+Math.round(Math.random()*14),demo:true};
  go('located');
}
/* camera */
function startCam(){stopCam();F.demoCam=false;F.camReady=false;go('camera')}
async function attachStream(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw {name:'NotSupported'};
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false});
    if(!F||F.step!=='camera'||F.demoCam){stopCam();return}
    const v=document.getElementById('cam'); v.srcObject=stream; await v.play().catch(()=>{}); F.camReady=true;
  }catch(e){
    if(!F||F.step!=='camera') return;
    F.camErr=e&&e.name==='NotAllowedError'?'Camera permission was denied.':'No camera is available here.'; go('camfail');
  }
}
function runDemoCam(){
  const c=document.getElementById('democam'); if(!c) return; const x=c.getContext('2d'); let t=0;
  const draw=()=>{
    if(!F||F.step!=='camera'||!document.getElementById('democam'))return;
    t+=.03;
    const g=x.createLinearGradient(0,0,480,640);g.addColorStop(0,'#E3C9C4');g.addColorStop(1,'#F2E6DA');x.fillStyle=g;x.fillRect(0,0,480,640);
    const s=Math.sin(t)*6;
    x.fillStyle='#7A1F2B';x.beginPath();x.ellipse(240+s,300,140,168,0,0,Math.PI*2);x.fill();
    x.beginPath();x.moveTo(104+s,330);x.quadraticCurveTo(240+s,530,376+s,330);x.lineTo(410+s,640);x.lineTo(70+s,640);x.fill();
    x.fillStyle='#C99A7A';x.beginPath();x.ellipse(240+s,296,100,124,0,0,Math.PI*2);x.fill();
    x.fillStyle='#2A2321';x.beginPath();x.arc(204+s,292,9,0,7);x.arc(276+s,292,9,0,7);x.fill();
    x.strokeStyle='#2A2321';x.lineWidth=6;x.beginPath();x.moveTo(186+s,268);x.lineTo(220+s,264);x.moveTo(260+s,264);x.lineTo(294+s,268);x.stroke();
    x.strokeStyle='#8E5B45';x.lineWidth=6;x.beginPath();x.arc(240+s,336,24,.25,Math.PI-.25);x.stroke();
    x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,600,480,40);x.fillStyle='#fff';x.font='600 20px Inter,Arial,sans-serif';x.fillText('DEMO CAMERA',20,628);
    raf=requestAnimationFrame(draw);
  };
  draw(); F.camReady=true;
}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(raf){cancelAnimationFrame(raf);raf=null}
}
function capture(){
  if(!F.camReady){toast('Camera is still starting…');return}
  const c=document.createElement('canvas');c.width=480;c.height=640;const x=c.getContext('2d');
  if(F.demoCam){x.drawImage(document.getElementById('democam'),0,0)}
  else{
    const v=document.getElementById('cam'),vw=v.videoWidth,vh=v.videoHeight;
    if(!vw){toast('Camera is still starting…');return}
    let sw,sh,sx,sy; if(vw/vh>.75){sh=vh;sw=vh*.75;sx=(vw-sw)/2;sy=0}else{sw=vw;sh=vw/.75;sx=0;sy=(vh-sh)/2}
    x.translate(480,0);x.scale(-1,1);x.drawImage(v,sx,sy,sw,sh,0,0,480,640);
  }
  const fl=document.getElementById('flash'); if(fl) fl.classList.add('go');
  F.photo=c.toDataURL('image/jpeg',.85);
  setTimeout(()=>{stopCam();go('preview')},280);
}
/* saving */
function runSaving(){
  const p=document.getElementById('prog');
  setTimeout(()=>{if(!p)return;p.children[0].className='done';p.children[0].querySelector('.st').innerHTML=ic('check',16);p.children[1].className='now'},800);
  setTimeout(()=>{if(F&&F.step==='saving')commit()},1700);
}
function commit(){
  const now=Date.now(), l=F.loc;
  if(F.kind==='punchIn'&&F.isException){
    Object.assign(S,{onDuty:true,inAt:now,inLoc:l||null,inPhoto:null,noorExc:'Pending',noorExcWhy:F.exWhy,noorExcNote:F.exNote,noorLoc:l?Object.assign({at:now},l):null});
    F.result={amber:true,title:'Exception submitted',sub:'You’re on duty. Your manager will review this exception.',rows:[['Time (Bahrain)',tm(now)],['Reason',esc(F.exWhy)],['Status','Pending review']]};
  }else if(F.kind==='punchIn'){
    Object.assign(S,{onDuty:true,inAt:now,inLoc:l,inPhoto:F.photo,noorExc:null,noorLoc:Object.assign({at:now},l)});
    F.result={title:'You’re punched in',sub:'Saved by the server. Have a great shift!',rows:[['Time (Bahrain)',tm(now)],['Location',addrFor(l)],['Accuracy','± '+l.acc+' m'],['Selfie','Saved privately']]};
  }else if(F.kind==='punchOut'){
    const d=dur(now-S.inAt);
    S.history.unshift({date:dt(new Date(S.inAt)),in:tm(S.inAt),out:tm(now),dur:d,kind:S.noorExc?'Exception':'Standard',place:'Seef Mall Kiosk'});
    F.result={title:'You’re punched out',sub:'Thanks for today. Your session is closed.',rows:[['Punched in',tm(S.inAt)],['Punched out',tm(now)],['Duty recorded',d],['Location',addrFor(l)]]};
    Object.assign(S,{onDuty:false,inAt:null,inLoc:null,inPhoto:null,noorExc:null,noorLoc:null});
  }else if(F.kind==='share'){
    const req=S.locReq;
    if(req){S.mreqs.push({to:'Noor Hasan',reason:req.reason,status:'Answered',at:req.at,respondedAt:now})}
    S.locReq=null; S.shares++; S.noorLoc=Object.assign({at:now},l);
    F.result={title:'Location sent',sub:req?'Your manager’s request has been answered.':'Your manager can now see this reading.',rows:[['Sent at',tm(now)],['Location',addrFor(l)],['Accuracy','± '+l.acc+' m']]};
  }
  F.step='done'; renderFlow();
}

  loginBack:()=>{S.login='start';S.loginErr='';render()},
  pkCreate:createPasskey,
  pkRemove:d=>{
    if(F&&F.kind==='pkconfirm'){}
    const i=+d.i, p=S.pk.agent[i];
    osOpen(`<div class="os-head"><div class="k" style="background:var(--red)">${ic('key',18)}</div><b>Remove this passkey?</b></div><p class="lead" style="margin:8px 0 16px">"${esc(p.dev)}" will no longer sign you in. You can still use your password.</p><button class="btn primary" data-act="pkRemoveYes" data-i="${i}">Remove passkey</button><button class="btn link" data-act="osClose">Keep it</button>`);
  },
  pkRemoveYes:d=>{S.pk.agent.splice(+d.i,1);S.log.unshift({at:Date.now(),txt:'Noor Hasan removed a passkey'});osClose();render();toast('Passkey removed')},
  signOut:()=>{closeFlowQuiet();S.auth=null;S.login='start';render();toast('Signed out')},
  /* agent */
  tab:d=>{S.tab=d.tab;render();view.scrollTop=0},
  punchIn:()=>openFlow('punchIn'),
  punchOut:()=>openFlow('punchOut'),
  share:()=>{if(!S.onDuty){toast('Punch in first. Sharing is only for on-duty time.');return}openFlow('share')},
  leave:()=>openFlow('leave'),
  close:closeFlow,
  locate:()=>locate(),
  demoLoc:demoLoc,
  startCam:startCam,
  demoCam:()=>{stopCam();F.demoCam=true;F.camReady=false;go('camera')},
  capture:capture,
  save:()=>go('saving'),
  exception:()=>{stopCam();clearTimeout(safety);go('exception')},
  saveException:()=>{F.exWhy=document.getElementById('exWhy').value;F.exNote=document.getElementById('exNote').value.trim();F.isException=true;go('saving')},
  ltype:(d,el)=>{el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  submitLeave:()=>{
    const type=(document.querySelector('#ltype .on')||{}).textContent||'Annual';
    const f=document.getElementById('lfrom').value,t=document.getElementById('lto').value;
    const fmt=s=>s?new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'';
    S.leaves.unshift({id:Date.now(),who:'Noor Hasan',type,dates:f===t?fmt(f):fmt(f)+' – '+fmt(t),status:'Pending',dur:document.getElementById('ldur').value,comment:document.getElementById('lcom').value.trim()});
    closeFlow(); S.tab='leave'; render(); toast('Leave request sent to your manager');
  },
  bell:()=>{
    if(S.auth==='manager'){const c=counts();toast(`${c.exc} exception${c.exc===1?'':'s'} and ${c.pl} leave request${c.pl===1?'':'s'} waiting`);return}
    toast(S.locReq&&S.onDuty?'Khalid A. requested your location':S.locReq?'1 location request. Punch in to respond.':'No new notifications');
  },
  toast:d=>toast(d.msg),
  /* manager */
  mtab:d=>{S.mtab=d.tab;render();view.scrollTop=0},
  rseg:d=>{S.rseg=d.seg;render()},
  mapPick:d=>{S.mapSel=d.id;S.mtab='map';render()},
  mapFocus:d=>{S.mapSel=d.id;S.mtab='map';render();view.scrollTop=0},
  openPhoto:d=>{
    const a=agents().find(x=>x.id===d.id);
    S.log.unshift({at:Date.now(),txt:`Khalid A. viewed ${a.name}'s punch-in photo`});
    openFlow('photo',{id:d.id});
  },
  openExc:d=>openFlow('exc',{id:d.id}),
  excDecide:d=>{
    const com=(document.getElementById('dcom')||{}).value||'';
    if(d.v==='Rejected'&&!com.trim()){F.err='Add a comment so the agent knows why.';renderFlow();return}
    if(F.id==='noor') S.noorExc=d.v; else TEAM.find(x=>x.id===F.id).excStatus=d.v;
    const a=agents().find(x=>x.id===F.id);
    S.log.unshift({at:Date.now(),txt:`Khalid A. ${d.v.toLowerCase()} ${a.name}'s attendance exception`});
    closeFlow();toast('Exception '+d.v.toLowerCase());
  },
  openLeave:d=>openFlow('ldec',{id:+d.id}),
  medDoc:()=>{F.medDenied=true;const l=S.leaves.find(x=>x.id===F.id);S.log.unshift({at:Date.now(),txt:`Denied: Khalid A. tried to open ${l.who}'s medical document`});renderFlow()},
  leaveDecide:d=>{
    const com=(document.getElementById('dcom')||{}).value||'';
    if(d.v==='Rejected'&&!com.trim()){F.err='A comment is required to reject.';renderFlow();return}
    const l=S.leaves.find(x=>x.id===F.id);l.status=d.v;l.decidedBy='Khalid A.';if(com.trim())l.comment=com.trim();
    S.log.unshift({at:Date.now(),txt:`Khalid A. ${d.v.toLowerCase()} ${l.who}'s leave (${l.dates})`});
    closeFlow();toast('Leave '+d.v.toLowerCase()+'. The agent is notified.');
  },
  reqLoc:d=>{
    const a=agents().find(x=>x.id===d.id);
    if(d.id==='noor'){
      if(!S.onDuty){toast('Noor is off duty and can’t be asked');return}
      if(S.locReq){toast('A request to Noor is already pending');return}
      S.locReq={from:'Khalid A. (Manager)',reason:'Fresh location check',at:Date.now()};
      render();toast('Request sent. Sign in as Noor to answer it.');return;
    }
    const r={to:a.name,reason:'Fresh location check',status:'Pending',at:Date.now()};S.mreqs.push(r);
    S.log.unshift({at:Date.now(),txt:`Khalid A. requested ${a.name}'s location`});
    render();toast(`Request sent to ${a.name}`);
    setTimeout(()=>{r.status='Answered';r.respondedAt=Date.now();const t=TEAM.find(x=>x.id===d.id);t.base=-(Date.now()-T0)/60000;t.lat+= (Math.random()-.5)*.001;t.lng+=(Math.random()-.5)*.001;if(S.auth==='manager'){render();toast(`${a.name} shared a fresh location`)}},7000);
  }
};
function closeFlowQuiet(){stopCam();clearTimeout(safety);sheet.classList.remove('open');F=null}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.tagName==='A') e.preventDefault();
  const fn=A[b.dataset.act]; if(fn) fn(b.dataset,b);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-act]')){e.preventDefault();A[e.target.dataset.act](e.target.dataset)}
});
document.getElementById('os').addEventListener('click',e=>{if(e.target.id==='os')osClose()});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='pwForm'){
    const u=document.getElementById('lu').value.trim().toLowerCase(), p=document.getElementById('lp').value;
    S.loginUser=u;
    const role=u==='agent.noor'?'agent':u==='manager.khalid'?'manager':null;
    if(!role||!p){S.loginErr=!p?'Enter your password.':'That username and password don’t match.';render();return}
    S.loginErr='';
    if(role==='manager'){S.login='totp';render();setTimeout(()=>{const o=document.getElementById('otp');if(o)o.focus()},50);return}
    signIn('agent','password');
  }
  if(e.target.id==='otpForm'){
    const v=document.getElementById('otp').value.trim();
    if(!/^\d{6}$/.test(v)){S.loginErr='Enter the 6 digits from your authenticator app.';render();return}
    signIn('manager','password');
  }
});

setInterval(()=>{const el=document.getElementById('elapsed');if(el&&S.inAt)el.textContent=hms(Date.now()-S.inAt)},1000);
render();
</script>

</body>
